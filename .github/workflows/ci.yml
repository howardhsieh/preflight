name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Scan this repository with preflight
        # docs/demo holds the generator for the README demo, whose inert
        # payload strings preflight correctly reports.
        run: go run ./cmd/preflight scan . --fail-on medium --exclude docs/demo
      - name: The demo generator must still be caught
        shell: bash
        run: |
          set -euo pipefail
          out=$(go run ./cmd/preflight scan docs/demo --fail-on none -f json)
          echo "$out" | grep -q '"rule_id": "PF702"'
